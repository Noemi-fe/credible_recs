   support lines, disagreement flags, messages, module 1's question or polite no, and the headings

   {name} is filled in by the page.
   The redesign of 13 Oct 2026 (the UX builder; Noemi: "something way nicer and advanced"; wording decided by

  feedbackHeading: "Was this useful?",
  feedbackUseful: "Useful",
  feedbackNotUseful: "Not useful",
  feedbackComment: "Anything to add? (optional)",
  feedbackPrivacy: "Please don't include personal details.",
  feedbackSend: "Send",
  feedbackChoose: "Choose Useful or Not useful first.",
  feedbackSending: "Sending…",
  feedbackThanks: "Thanks for your feedback!",
  feedbackFailed: "Your feedback couldn't be sent. Please try again.",
  feedbackTooMany: "That's a lot of feedback in a short time. Please try again in a few minutes.",
  firstTimeQuestion: "First time here?",
  firstTimeYes: "Yes",
  firstTimeNo: "No, I've been before",
  firstTimeClose: "Close this question",
  firstTimeThanks: "Thanks!",
};
</script>
<style>
/* Credible picks, redesigned 13 Oct 2026 (the UX builder): calm and editorial, a warm neutral palette with one green
   accent for trust, the system's own serif for headings (no font is downloaded) and its sans for everything else.
   Light by default, dark when the computer is set to dark mode; every text colour meets WCAG AA contrast on the
   surfaces it sits on (4.5:1 or more). Motion is small and never holds content back; it stops for reduced motion.
   The how-we-score page (engine/how_page.py) copies this block in, so both pages look alike. */
:root {
  color-scheme: light dark;
  --bg: #f6f3ee;
  --surface: #fffdf9;
  --sunken: #f1ede5;
  --text: #1c1a17;
  --muted: #5d574e;
  --line: #e4ded3;
  --line-strong: #cdc4b5;
  --accent: #1d6a51;
  --accent-hover: #15543f;
  --accent-soft: #e2efe8;
  --on-accent: #ffffff;
  --ok: #1d6a51;
  --ok-soft: #e2efe8;
  --warn: #8a4f0b;
  --warn-soft: #fbefdc;
  --bad: #a5311f;
  --bad-soft: #fbe5df;
  --bar-for: #2f8566;
  --bar-against: #e0a245;
  --bar-against-2: #eebd73;
  --bar-track: #e9e3d8;
  /* Under the picks (13 Oct 2026, round two): one colour family per kind of section; text colours meet AA on their
     grounds (engine/tests/test_web_ux.py computes every pair). */
  --worth: #5d574e;
  --worth-bg: #ece6db;
  --worth-soft: #e4ddd0;
  --worth-line: #d9cfbf;
  --skip: #9f2733;
  --skip-bg: #fbeaea;
  --skip-soft: #f7dadc;
  --skip-line: #efc9cc;
  --advice: #235a87;
  --advice-bg: #e8f0f7;
  --advice-soft: #d9e7f3;
  --advice-line: #c9dbea;
  --care: #1d6a51;
  --care-bg: #e3f0e8;
  --care-soft: #d3e8db;
  --care-line: #c0dccb;
  --quiet-bg: #efebe4;
  --shadow: 0 1px 2px rgba(48, 36, 16, .05), 0 6px 20px rgba(48, 36, 16, .06);
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131210;
    --surface: #1c1b18;
    --sunken: #232220;
    --text: #ece8e1;
    --muted: #a9a297;
    --line: #2e2c28;
    --line-strong: #45423c;
    --accent: #6fc4a1;
    --accent-hover: #8fd6b8;
    --accent-soft: #1b2f27;
    --on-accent: #0c1d16;
    --ok: #6fc4a1;
    --ok-soft: #1b2f27;
    --warn: #e7b366;
    --warn-soft: #2e2517;
    --bad: #f09a89;
    --bad-soft: #341d19;
    --bar-for: #4fae88;
    --bar-against: #e3ac5c;
    --bar-against-2: #b98637;
    --bar-track: #2c2a26;
    --worth: #c4b9a6;
    --worth-bg: #2a251d;
    --worth-soft: #383126;
    --worth-line: #4a4134;
    --skip: #f3a3ab;
    --skip-bg: #2c171a;
    --skip-soft: #3b1f22;
    --skip-line: #4b2a2e;
    --advice: #8ec0ea;
    --advice-bg: #152029;
    --advice-soft: #1c2c3a;
    --advice-line: #263a4c;
    --care: #6fc4a1;
    --care-bg: #15271f;
    --care-soft: #1b3328;
    --care-line: #26442f;
    --quiet-bg: #191816;
    --shadow: 0 1px 0 rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
a { color: var(--accent); text-underline-offset: .18em; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
h1, h2, h3, h4, h5 { line-height: 1.2; }
button { font: inherit; color: inherit; }
.icon { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
  stroke-linejoin: round; vertical-align: -.2em; }
.num { font-variant-numeric: tabular-nums; }
.kicker { margin: 0 0 6px; font-size: 12.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }

/* The top bar: the name and the how-we-score page. */
.topbar { border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font: 600 20px/1 var(--serif); letter-spacing: -.01em; }
.brand:hover { color: var(--text); }
.brand .icon { width: 26px; height: 26px; color: var(--accent); stroke-width: 1.6; }
.topbar nav a { font-size: 14.5px; font-weight: 550; }

/* The older header (the how-we-score page still uses it). */
.site { padding: 36px 0 8px; }
.site h1 { margin: 0 0 10px; font: 600 clamp(32px, 5vw, 44px)/1.1 var(--serif); letter-spacing: -.02em; }
.intro { margin: 0; color: var(--muted); max-width: 62ch; font-size: 17px; }
.back { margin: 0 0 14px; font-size: 14.5px; }

/* The hero: a question, the search box, examples and how it works. */
.hero { padding: 56px 0 8px; text-align: center; }
.hero h1 { margin: 0 auto 14px; max-width: 24ch; font: 600 clamp(34px, 6vw, 56px)/1.06 var(--serif); letter-spacing: -.025em; text-wrap: balance; }
.hero .intro { margin: 0 auto; max-width: 60ch; text-wrap: pretty; }
.search { max-width: 720px; margin: 32px auto 0; text-align: left; }
.search-label { display: block; font-weight: 650; margin: 0 0 8px; }
.search-box { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.search-box > .icon { color: var(--muted); width: 22px; height: 22px; }
.search input { flex: 1 1 auto; min-width: 0; height: 48px; font: inherit; font-size: 17px; padding: 0 4px; border: 0; background: transparent; color: var(--text); }
.search input:focus { outline: none; }
.search input::placeholder { color: var(--muted); opacity: .85; }
.slash { flex: none; display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border: 1px solid var(--line-strong);
  border-radius: 6px; font: 600 12px/1 var(--sans); color: var(--muted); background: var(--sunken); }
.search-box:focus-within .slash { visibility: hidden; }
.go { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: 0; border-radius: 12px;
  background: var(--accent); color: var(--on-accent); font-weight: 650; cursor: pointer; transition: background-color .15s; }
.go:hover { background: var(--accent-hover); }
.hint { margin: 8px 0 0; font-size: 14px; color: var(--muted); }

/* Example requests and recent searches, as chips. */
.examples { max-width: 720px; margin: 22px auto 0; text-align: left; }
.examples > summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px;
  font-weight: 650; color: var(--muted); padding: 4px 0; }
.examples > summary::-webkit-details-marker { display: none; }
.examples > summary .icon { transition: transform .15s; }
.examples[open] > summary .icon { transform: rotate(180deg); }
.example-group { margin: 10px 0 0; }
.example-group h2 { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .09em; color: var(--muted); margin: 14px 0 8px; }
.example-group h2 .note { font-size: 12.5px; font-weight: 450; text-transform: none; letter-spacing: 0; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; text-align: left; padding: 7px 14px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; transition: border-color .15s, background-color .15s; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip .icon { color: var(--muted); }
.link-button { border: 0; background: none; padding: 2px 4px; color: var(--accent); font-size: 13.5px; font-weight: 600; cursor: pointer;
  text-decoration: underline; text-underline-offset: .18em; text-transform: none; letter-spacing: 0; }

/* How it works: three steps under the box. */
.steps { list-style: none; counter-reset: step; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 980px;
  margin: 48px auto 0; padding: 28px 0 0; border-top: 1px solid var(--line); text-align: left; }
.steps li { counter-increment: step; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
.steps li::before { content: counter(step); grid-row: span 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); font: 600 17px/1 var(--serif); }
.steps h2 { margin: 4px 0 0; font-size: 16px; }
.steps p { margin: 0; color: var(--muted); font-size: 14.5px; }

/* After a search: the hero steps aside and the box stays on top. */
.hero.compact { padding-top: 24px; text-align: left; }
.hero.compact h1, .hero.compact .search-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero.compact .intro, .hero.compact .steps, .hero.compact .hint, .hero.compact > .kicker { display: none; }
.hero.compact .search, .hero.compact .examples { margin-left: 0; margin-top: 0; max-width: 760px; }
.hero.compact .examples { margin-top: 8px; }

/* Loading: an honest line, and the answer's shape while it's on its way. */
.status { min-height: 1.6em; margin: 20px 0 0; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.status.loading::before { content: ""; flex: none; width: 16px; height: 16px; border: 2px solid var(--line-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#results[aria-busy="true"] > :not(.skeleton) { opacity: .45; transition: opacity .2s; }
.sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--sunken) 0%, var(--line) 50%, var(--sunken) 100%);
  background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk-heading { width: min(420px, 70%); height: 40px; margin: 28px 0 18px; }
.sk-strip { height: 74px; margin: 0 0 24px; border-radius: var(--radius); }
.sk-title { width: 45%; height: 26px; margin: 0 0 18px; }
.sk-line { height: 14px; margin: 0 0 10px; }
.sk-line.short { width: 60%; }
.sk-block { height: 96px; margin-top: 18px; }

/* Notices: the honest message, module 1's question or polite no, and errors. */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); margin: 16px 0; }
.notice > .icon { margin-top: 3px; color: var(--accent); }
.notice h2 { font: 600 20px/1.25 var(--serif); margin: 0 0 6px; }
.notice p { margin: 0; }
.notice p + p { margin-top: 6px; }
.notice .actions { margin-top: 12px; }
.notice.honest { background: var(--warn-soft); border-color: transparent; }
.notice.honest > .icon { color: var(--warn); }
.notice.error { background: var(--bad-soft); border-color: transparent; }
.notice.error > .icon { color: var(--bad); }
.button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
.button:hover { border-color: var(--accent); }

/* The answer's head: what it is, what it read, and its tools. */
#results > * { animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(6px); } }
.answer-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin: 28px 0 18px; }
.answer-title { margin: 0; font: 600 clamp(28px, 4.4vw, 42px)/1.1 var(--serif); letter-spacing: -.02em; overflow-wrap: anywhere; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--text); font-size: 14px; font-weight: 550; cursor: pointer; }
.tool:hover { border-color: var(--accent); }
.tool .icon { color: var(--muted); }

/* The reading strip: how much the answer read, in numbers. */
/* Round two (13 Oct 2026): housekeeping, so quiet: no box of its own, small numbers between two hairlines. */
.reading { margin: 0 0 24px; border-block: 1px solid var(--line); }
.reading dl { display: flex; flex-wrap: wrap; margin: 0; }
.stat { flex: 1 1 180px; display: flex; flex-direction: column; padding: 10px 18px 10px 0; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 18px; }
.stat dd { margin: 0; }
.stat .value { order: -1; font: 600 21px/1.15 var(--serif); font-variant-numeric: tabular-nums; }
.stat dt { font-size: 13.5px; font-weight: 600; }
.stat .note { font-size: 13px; color: var(--muted); }
.stat .ratio { order: 3; margin-top: 8px; height: 6px; border-radius: 99px; background: var(--bar-track); overflow: hidden; }
.stat .ratio span { display: block; height: 100%; width: calc(var(--share) * 100%); background: var(--accent); border-radius: 99px; }
.why { margin: 0; padding: 0 0 10px; font-size: 13.5px; }

/* At a glance: the picks side by side. */
.glance { margin: 0 0 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }

/* The picks. */
.picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }

  scroll-margin-top: 16px; }

  color: var(--on-accent); font: 600 22px/1 var(--serif); }
.card-title { min-width: 0; }
.card-head h3 { margin: 6px 0 0; font: 600 clamp(22px, 3vw, 27px)/1.2 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
.model { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); }
.card-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 24px 32px; margin-top: 18px; }

.card h4 { margin: 0 0 10px; font-size: 12.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

/* "In short:" (13 Oct 2026): our one-line summary of what a pick's credible voices say. Our words, so never drawn
   like a quote: no quotation marks, no quote box, no serif; with the note saying it is ours. */
.summary { margin: 0; font-size: 17px; line-height: 1.55; }
/* An ingredient-led answer (13 Oct 2026): every product's form as a small chip, and the note under the title. */
.form-chip { display: inline-block; margin: 6px 6px 0 0; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; }
.ingredient-note { display: flex; gap: 8px; align-items: flex-start; margin: -6px 0 16px; color: var(--muted); max-width: 80ch; }
.ingredient-note .icon { color: var(--accent); margin-top: 3px; }
.summary-label { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
  font-size: 13px; font-weight: 700; vertical-align: 1px; }
.summary-note { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }

/* Why we trust it: the credibility meter, then the answer's own reason and support line. */
.trust { padding: 14px 16px; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); }
.trust p { margin: 8px 0 0; font-size: 14.5px; }
.trust .reason { font-weight: 600; font-size: 15px; }
.meter .bar { display: flex; gap: 2px; height: 10px; border-radius: 99px; overflow: hidden; background: var(--bar-track); }
.meter .bar .for { flex: 0 1 calc(var(--for) * 100%); background: var(--bar-for); }
.meter .bar .against { flex: 1 1 0; min-width: 4px; background: repeating-linear-gradient(135deg, var(--bar-against) 0 4px, var(--bar-against-2) 4px 7px); }
.legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }

.legend .for::before, .legend .against::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--bar-for); }
.legend .against::before { background: repeating-linear-gradient(135deg, var(--bar-against) 0 3px, var(--bar-against-2) 3px 5px); }
.no-downsides { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
.no-downsides .icon { color: var(--accent); margin-top: 2px; }

/* Price, where it's sold, notes and the mixed-opinions flag. */
.card-main > .fact + .fact, .card-main > .fact + .budget, .card-main > .budget + .fact { margin-top: 6px; }

.badges { list-style: none; margin: 0; padding: 0; display: inline-flex; flex-wrap: wrap; gap: 6px; }

.source-link { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.source-link .icon { width: 14px; height: 14px; }
.downsides .quote { border-left-color: var(--bar-against); }
.care .quote { border-left-color: var(--line-strong); }
.share { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.care .lead, .items .lead { margin: 0 0 8px; }

/* A card's toggle for the rest of its evidence: quotes, downsides and care. */
.more { margin-top: 12px; }
.more > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.more > summary { width: max-content; max-width: 100%; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px;
  font-weight: 600; color: var(--accent); background: var(--surface); }
.more > summary:hover { border-color: var(--accent); }
.more > summary::-webkit-details-marker { display: none; }
details > summary .icon { transition: transform .15s; }
details[open] > summary .icon { transform: rotate(180deg); }
.more-body { margin-top: 14px; }
.more-body > * + h4, .more-body > .quotes + h4 { margin-top: 20px; }

/* Under the picks (13 Oct 2026, round two; Noemi: "a little more distinct from the picks... a little too uniform"): the
   picks are the only raised cards. Each section under them is a flat panel in its own colour family, with a head of

.more-zone { display: grid; gap: 22px; margin-top: 56px; }

  color: var(--fam); }

.row-name { margin: 0; font: 600 16px/1.35 var(--sans); color: var(--text); overflow-wrap: anywhere; }

.tag { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--fam-soft); color: var(--fam); font-size: 13px;

.zone-panel .form-chip { margin: 0; }

.fam-worth .quote { border-left-color: var(--bar-for); }

.fold { margin: 8px 0 4px; font-size: 14px; background: var(--surface); }

.fold[aria-expanded="true"] .icon { transform: rotate(180deg); }
/* What to look for: a checklist, "Look for" beside "Avoid". */

.quiet-zone { display: grid; gap: 18px; margin-top: 56px; padding: 20px 22px; border: 1px dashed var(--line-strong); border-radius: var(--radius);

<!-- Filled in by the server: the answer's own headings (engine/answer.py), the example requests and the length limit. -->
<script type="application/json" id="settings">{{SETTINGS}}</script>

<script>
/* How this page works, in short:
   1. The search box sends the request to this computer's server (/api/answer?q=...) and shows a loading line, then,
      if the answer takes more than a moment, the answer's shape (grey blocks) where it will appear.
   2. The server answers with JSON (its shape is described at the top of engine/web.py).
   3. The page draws the answer. Every piece of text from the answer is added as plain text (never as HTML),
      so a comment containing "<script>" shows those characters and is never run.
   4. Links are checked before they are drawn, and there are two kinds only: a quote's comment on Reddit
      (redditUrl), and a shop's page for a price or for where a product is sold (shopUrl: https only, the shop's own
      address from data/prices.json, as the server sends it). Any other address is shown without a link.
   5. Since 11 Oct 2026 (going live): under every answer, "Was this useful?" (feedbackForm); once per browser, "First
      time here?" (firstTimeQuestion). Both send to this site's server only (sendFeedback). When visit counting is on,
      a few events are counted by fixed names (track), never anything typed.
   6. Since 13 Oct 2026 (the redesign): the visitor's last few requests are kept in this browser's own storage for the
      "recent searches" chips (rememberSearch), never sent anywhere and cleared with one button; the "/" key goes to
      the search box; and the page notes how long drawing an answer took in the browser's own performance timeline
      (measureDraw), which is never sent anywhere either. */
(function () {
  "use strict";
  const SETTINGS = JSON.parse(document.getElementById("settings").textContent);
  const WORDING = SETTINGS.wording;
  const form = document.getElementById("search");
  const input = document.getElementById("q");
  const hero = document.getElementById("hero");
  const examples = document.getElementById("examples");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  // A pick's quotes in view at once (2, or 1 on a phone, where each card is long); the rest are a click away (its "more"
  // toggle).
  const QUOTES_SHOWN_FIRST = window.matchMedia("(max-width: 600px)").matches ? 1 : 2;
  const SKELETON_AFTER_MS = 150;  // a remembered answer comes back sooner than this, so its grey blocks never flash
  const SLOW_AFTER_MS = 4000;  // when the loading line says why a fresh answer can take longer
  const RECENT_MAX = 5;  // recent searches kept
  const LIST_SHOWN_FIRST = 5;  // "Skip these" items in view at once, strongest first (the API's order); the rest a click away
  const WORTH_SHOWN_FIRST = 6;  // "Also worth a look" has 3 items at most today; a longer one would fold the same way
  let foldedLists = 0;  // numbers each folded list, so its toggle points at it
  let latest = 0;  // the number of the newest search: an older, slower answer is never drawn over it
  let pending = null;  // the newest search's request, cancelled when a newer search starts (AbortController)
  let skeletonTimer = 0;
  let slowTimer = 0;
  let drawStarted = 0;  // when drawing the newest answer started (performance.now), for measureDraw

  // --- Small helpers ---

  /** A new element. Children that are strings become plain text, never HTML. An attribute that is null, undefined or
      false is left out. */
  function el(tag, attributes, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (name === "class") node.className = value;
      else node.setAttribute(name, value);
    }
    for (const child of children) {
      if (child !== null && child !== undefined && child !== false) node.append(child);
    }
    return node;
  }

  /** "Pick {rank}:" with {rank: 1} gives "Pick 1:". A value is never searched for slots itself. */
  function fill(template, values) {
    return template.replace(/\{(\w+)\}/g, (slot, name) => (name in values ? String(values[name]) : slot));
  }

  /** The same, as page pieces: each filled slot drawn in bold (as text), the words around it as text. */
  function fillNodes(template, values) {
    return template.split(/(\{\w+\})/).filter(Boolean).map((part) => {
      const slot = /^\{(\w+)\}$/.exec(part);
      return slot && slot[1] in values ? el("strong", { class: "num" }, String(values[slot[1]])) : part;
    });
  }

  /** One of the page's icons (the templates at the end of the page), or null. */
  function icon(name, extraClass) {
    const template = document.getElementById("i-" + name);
    if (!template) return null;
    const svg = template.content.firstElementChild.cloneNode(true);
    if (extraClass) svg.classList.add(extraClass);
    return svg;
  }

  /** The address, if it is a Reddit page (http or https, reddit.com or one of its subdomains); otherwise null. */
  function redditUrl(address) {
    let url;
    try { url = new URL(address); } catch (error) { return null; }
    const host = url.hostname.toLowerCase();
    const isReddit = host === "reddit.com" || host.endsWith(".reddit.com");
    return (url.protocol === "https:" || url.protocol === "http:") && isReddit ? url.href : null;
  }

  /** The address, if it is a safe shop page: https only, with no name or password in it; otherwise null.
      The server only ever sends the shop's own address from the price list (data/prices.json). */
  function shopUrl(address) {
    let url;
    if (!address) return null;
    try { url = new URL(address); } catch (error) { return null; }
    return url.protocol === "https:" && url.hostname && !url.username && !url.password ? url.href : null;
  }

  /** The community a checked Reddit address is in ("r/BuyItForLife"), from its path; null when it doesn't say. */
  function community(address) {
    const parts = new URL(address).pathname.split("/");
    return parts[1] === "r" && /^[A-Za-z0-9_]{2,21}$/.test(parts[2] || "") ? "r/" + parts[2] : null;
  }

  /** A product's form in an answer to a request naming an ingredient but no type (13 Oct 2026): "Form: pads", as a
      small chip; nothing otherwise. */
  function formChip(form) {
    return form ? el("span", { class: "form-chip" }, WORDING.form_label + ": " + form) : null;
  }

  /** A count in words, one or many: `forms` is [one, many], with {n} for the count. */
  function counted(forms, n) { return fill(n === 1 ? forms[0] : forms[1], { n: n.toLocaleString("en-GB") }); }

  /** The same, as page pieces with the count in bold. */
  function countedNodes(forms, n) { return fillNodes(n === 1 ? forms[0] : forms[1], { n: n.toLocaleString("en-GB") }); }

  /** Names as words: "A", "A and B", "A, B and C". */
  function listed(names) {
    return names.length < 2 ? names.join("") : names.slice(0, -1).join(", ") + LABELS.listAnd + names[names.length - 1];
  }

  /** Whether movement is welcome (the computer isn't set to reduce motion). */
  function motionOk() { return !window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

  /** A text as shown: swear words keep their first and last letters, the rest starred ("f**k"), with the answer's own
      list (engine/answer.py, MASKED_WORDS; Noemi, 12 Oct 2026). Display only: the quote checked word for word stays the
      comment's own. */
  const MASKED = new RegExp("\\b(?:" + WORDING.masked_words.join("|") + ")\\b", "gi");
  function masked(text) {
    return String(text).replace(MASKED, (word) => word[0] + "*".repeat(word.length - 2) + word[word.length - 1]);
  }

  // --- Visit counts (11 Oct 2026): GoatCounter events, only when counting is on ---

  /* The only events ever counted, by these fixed names, never with anything typed on the page. Each name's words are
     what Noemi's GoatCounter page shows. */
  const EVENTS = {
    "search": "A search was made",
    "answer-ok": "Answer: picks",
    "answer-clarify": "Answer: one question first",
    "answer-out-of-scope": "Answer: outside skincare and kitchen",
    "feedback-useful": "Feedback: useful",
    "feedback-not-useful": "Feedback: not useful",
    "first-time-yes": "First time here: yes",
    "first-time-no": "First time here: no, been before",
  };
  const STATUS_EVENTS = { ok: "answer-ok", clarify: "answer-clarify", out_of_scope: "answer-out-of-scope" };

  /** Counts one event with GoatCounter when visit counting is on. A name not in EVENTS is never sent; without
      GoatCounter's script (not loaded yet, or blocked) nothing happens; and counting can never break the page. */
  function track(name) {
    if (!SETTINGS.counting || !Object.hasOwn(EVENTS, name)) return;
    const counter = window.goatcounter;
    if (!counter || typeof counter.count !== "function") return;
    try { counter.count({ path: name, title: EVENTS[name], event: true }); } catch (error) { /* not counted, that's all */ }
  }

  // --- Feedback (11 Oct 2026): to this site's own server only ---

  /** Sends one feedback record (engine/feedback.py says which); resolves to {ok, code}, and never throws. */
  async function sendFeedback(record) {
    try {
      const response = await fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(record),
        // The page sends no Referer; this lets the browser say which site the feedback comes from (the Origin header,
        // which the server checks), and never the page's address.
        referrerPolicy: "strict-origin",
      });
      if (response.ok) return { ok: true };
      const data = await response.json().catch(() => ({}));
      return { ok: false, code: data.code };
    } catch (error) {
      return { ok: false, code: "offline" };
    }
  }

  let feedbackForms = 0;  // numbers each form, so its labels point at its own boxes

  /** "Was this useful?" under an answer: Useful or Not useful, an optional comment, then Send. Nothing is sent before
      Send; then a short thanks takes the form's place. What goes to the server: the request, the choice, the comment,
      the product type and the kind of answer. Nothing about who sent it. */
  function feedbackForm(request, query) {
    const id = "feedback-" + (++feedbackForms);
    let verdict = null;
    const note = el("p", { class: "feedback-note", role: "status" });
    const choices = [["useful", LABELS.feedbackUseful, null], ["not useful", LABELS.feedbackNotUseful, "down"]].map(([value, words, turn]) => {
      const choice = el("button", { type: "button", class: "choice", "aria-pressed": "false" }, icon("thumb", turn), words);
      choice.addEventListener("click", () => {
        verdict = value;
        for (const other of choices) other.setAttribute("aria-pressed", String(other === choice));
        note.textContent = "";
      });
      return choice;
    });
    const comment = el("textarea", { id: id + "-comment", rows: "3", maxlength: String(SETTINGS.maxCommentChars) });
    const send = el("button", { type: "submit", class: "send" }, LABELS.feedbackSend);
    const box = el("form", { class: "feedback", "aria-labelledby": id + "-heading" },
      el("h2", { id: id + "-heading" }, LABELS.feedbackHeading),
      el("div", { class: "choices", role: "group", "aria-labelledby": id + "-heading" }, ...choices),
      el("label", { for: id + "-comment" }, LABELS.feedbackComment),
      comment,
      el("p", { class: "hint" }, LABELS.feedbackPrivacy),
      send, note);
    box.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!verdict) { note.textContent = LABELS.feedbackChoose; return; }
      send.disabled = true;
      note.textContent = LABELS.feedbackSending;
      const sent = await sendFeedback({ kind: "answer_feedback", request, verdict, comment: comment.value.trim() || null,
                                        product_type: query.product_type, status: query.status });
      if (sent.ok) {
        track(verdict === "useful" ? "feedback-useful" : "feedback-not-useful");
        const thanks = el("p", { class: "feedback-thanks", role: "status", tabindex: "-1" }, LABELS.feedbackThanks);
        box.replaceWith(thanks);
        thanks.focus();
        return;
      }
      send.disabled = false;
      note.textContent = sent.code === "too_many_requests" ? LABELS.feedbackTooMany : LABELS.feedbackFailed;
    });
    return box;
  }

  // --- The browser's own storage: "First time here?" and recent searches ---

  const FIRST_TIME_KEY = "credible-recs:first-time";
  const RECENT_KEY = "credible-recs:recent";

  /* The browser's own storage, for two things only: that "First time here?" was asked, and the visitor's own last few
     requests (13 Oct 2026). Every use is wrapped in try and catch, since storage can be switched off, full, or refused
     inside a frame. */
  function recall(key) { try { return localStorage.getItem(key); } catch (error) { return null; } }
  function remember(key, value) { try { localStorage.setItem(key, value); return true; } catch (error) { return false; } }
  function forget(key) { try { localStorage.removeItem(key); } catch (error) { /* nothing kept */ } }

  /** Asked once per browser: the browser notes it as asked once it has been seen (then answered or closed), so nobody
      is asked twice; where the browser can't keep that note, it isn't shown at all. Since 13 Oct 2026 it sits in the
      quiet zone at the end of the page, which not every visitor reaches, so until it has been on screen the note says
      "pending" and the question is still asked on a later visit. Only the yes or no goes to the server, and it is
      counted as an event when visit counting is on. */
  function firstTimeQuestion() {
    const state = recall(FIRST_TIME_KEY);
    if (state !== null && state !== "pending") return;  // asked before: seen, answered or closed
    if (!remember(FIRST_TIME_KEY, "pending")) return;  // the browser can't keep the note: never asked, so never twice
    const box = el("aside", { class: "first-time", "aria-labelledby": "first-time-question" });
    function answered(answer) {
      remember(FIRST_TIME_KEY, "answered");
      sendFeedback({ kind: "first_time", answer });
      track(answer === "yes" ? "first-time-yes" : "first-time-no");
      const thanks = el("p", { role: "status", tabindex: "-1" }, LABELS.firstTimeThanks);
      box.replaceChildren(thanks);
      thanks.focus();
    }
    const yes = el("button", { type: "button", class: "chip" }, LABELS.firstTimeYes);
    const no = el("button", { type: "button", class: "chip" }, LABELS.firstTimeNo);
    const close = el("button", { type: "button", class: "close", "aria-label": LABELS.firstTimeClose, title: LABELS.firstTimeClose }, "×");
    yes.addEventListener("click", () => answered("yes"));
    no.addEventListener("click", () => answered("no"));
    close.addEventListener("click", () => { remember(FIRST_TIME_KEY, "closed"); box.remove(); input.focus(); });
    box.append(el("p", { id: "first-time-question" }, LABELS.firstTimeQuestion), el("div", { class: "answers" }, yes, no), close);
    document.getElementById("first-time-slot").append(box);
    whenSeen(box, () => remember(FIRST_TIME_KEY, "asked"));
  }

  /** Calls `then` once, when `node` has been at least half on screen; at once in a browser that can't tell. */
  function whenSeen(node, then) {
    if (!("IntersectionObserver" in window)) { then(); return; }
    const watcher = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) { watcher.disconnect(); then(); }
    }, { threshold: 0.5 });
    watcher.observe(node);
  }

  /** The visitor's recent requests, newest first: only texts, as they typed them; anything else kept there is ignored. */
  function recentSearches() {
    let list;
    try { list = JSON.parse(recall(RECENT_KEY) || "[]"); } catch (error) { return []; }
    if (!Array.isArray(list)) return [];
    return list.filter((item) => typeof item === "string" && item.trim() && item.length <= SETTINGS.maxChars).slice(0, RECENT_MAX);
  }

  /** Keeps a request the visitor searched for at the front of their recent searches (once, whatever its capitals). */
  function rememberSearch(request) {
    let recent = recentSearches().filter((other) => other.toLowerCase() !== request.toLowerCase());
    recent = [request, ...recent].slice(0, RECENT_MAX);
    remember(RECENT_KEY, JSON.stringify(recent));
    drawRecent();
  }

  function clearRecent() {
    forget(RECENT_KEY);
    drawRecent();
    input.focus();
  }

  /** The recent searches as chips, above the examples; nothing when there are none. */
  function drawRecent() {
    const box = document.getElementById("recent");
    const recent = recentSearches();
    box.hidden = !recent.length;
    if (!recent.length) { box.replaceChildren(); return; }
    const clear = el("button", { type: "button", class: "link-button", "aria-label": LABELS.recentClearLabel }, LABELS.recentClear);
    clear.addEventListener("click", clearRecent);
    box.replaceChildren(
      el("h2", {}, el("span", {}, LABELS.recentHeading), el("span", { class: "note" }, LABELS.recentNote), clear),
      el("ul", { class: "chips" }, ...recent.map((text) => el("li", {}, searchChip(text, icon("clock"))))));
  }

  /** A chip that searches for its text. */
  function searchChip(text, mark) {
    const chip = el("button", { type: "button", class: "chip" }, mark, el("span", {}, text));
    chip.addEventListener("click", () => { input.value = text; search(text, true); });
    return chip;
  }

  // --- The fixed text of the page ---

  document.title = LABELS.pageTitle;
  for (const node of document.querySelectorAll("[data-label]")) node.textContent = LABELS[node.dataset.label];
  input.placeholder = LABELS.searchPlaceholder;
  input.maxLength = SETTINGS.maxChars;
  document.getElementById("steps").append(...LABELS.steps.map(([title, text]) => el("li", {}, el("h2", {}, title), el("p", {}, text))));

  function drawExamples() {
    const groups = document.getElementById("example-groups");
    for (const category of Object.keys(LABELS.categories)) {
      const items = SETTINGS.examples.filter((example) => example.category === category);
      if (!items.length) continue;
      const chips = items.map((example) => el("li", {}, searchChip(example.text, null)));
      groups.append(el("div", { class: "example-group" }, el("h2", {}, LABELS.categories[category]), el("ul", { class: "chips" }, ...chips)));
    }
    examples.hidden = !SETTINGS.examples.length && !recentSearches().length;
  }

  // --- Drawing an answer ---

  function quoteBlock(quote) {
    const address = redditUrl(quote.url);
    const link = address && el("a", { href: address, target: "_blank", rel: "noopener noreferrer", class: "source-link" },
      WORDING.link_text, el("span", { class: "visually-hidden" }, " " + LABELS.newTab), icon("external"));
    const where = address && community(address);
    const badges = quote.badges.length > 0 && el("ul", { class: "badges", "aria-label": LABELS.badges },
      ...quote.badges.map((badge) => el("li", {}, badge)));
    return el("figure", { class: "quote" }, el("blockquote", {}, masked(quote.text)),
      el("figcaption", {}, where && el("span", { class: "community" }, where), badges, link));
  }

  function quoteList(quotes, extraClass) {
    return el("ul", { class: "quotes" + (extraClass ? " " + extraClass : "") }, ...quotes.map((quote) => el("li", {}, quoteBlock(quote))));
  }

  /** The price line: amount, shop and date with a link to the shop's page, or "Price not checked yet"; then how it
      meets the budget, if the request has one. */
  function priceLines(price) {
    const shop = shopUrl(price.url);
    const link = shop && el("a", { href: shop, target: "_blank", rel: "noopener noreferrer" },
      WORDING.price_link_text, el("span", { class: "visually-hidden" }, " " + LABELS.shopNewTab));
    const line = price.amount === null
      ? el("p", { class: "fact price muted" }, icon("tag"), el("span", {}, price.text))
      : el("p", { class: "fact price" }, icon("tag"), el("span", {}, el("strong", {}, WORDING.price_label + ": "), price.text, link && " · ", link));
    return [line, price.budget_note && el("p", { class: price.budget_status === "within" ? "budget within" : "budget" }, price.budget_note)];
  }

  /** Whether the pick is still sold, as text: "Sold at <shop>, checked <date>" (or "Sold second-hand only: <shop>,
      checked <date>", 10 Oct 2026) with a link to the shop's page (through the same https check as the price's), or
      "Availability not checked yet". */
  function availabilityLine(availability) {
    if (!availability) return null;
    const shop = shopUrl(availability.url);
    const link = shop && el("a", { href: shop, target: "_blank", rel: "noopener noreferrer" },
      WORDING.price_link_text, el("span", { class: "visually-hidden" }, " " + LABELS.shopNewTab));
    return el("p", { class: availability.available ? "fact availability" : "fact availability muted" }, icon("store"),
      el("span", {}, availability.text, link && " · ", link));
  }

  /** A pick's cautions (product facts, 9 Oct 2026): each "Note: ..." from the answer, drawn as text only. */
  function cautionLines(cautions) {
    return (cautions || []).map((text) => withIcon("info", el("p", { class: "caution" }, text)));
  }

  /** A line with an icon in front, its words wrapped so they flow beside it. */
  function withIcon(name, line) {
    line.replaceChildren(...[icon(name), el("span", {}, ...line.childNodes)].filter(Boolean));
    return line;
  }

  function foldedList(listClass, entries, first) {

    const card = () => el("li", { class: "card" }, el("span", { class: "sk sk-title" }), el("span", { class: "sk sk-line" }),
      el("span", { class: "sk sk-line short" }), el("span", { class: "sk sk-block" }));
    return el("div", { class: "skeleton", "aria-hidden": "true" }, el("span", { class: "sk sk-heading" }), el("span", { class: "sk sk-strip" }),
      el("ol", { class: "picks" }, card(), card(), card()));
  }

  // --- Searching ---

  function showOnly(...nodes) {
    results.replaceChildren(...nodes);
  }

  function errorText(code) {
    const text = (SETTINGS.public && LABELS.errorsPublic[code]) || LABELS.errors[code] || LABELS.errors.other;
    return fill(text, { max: SETTINGS.maxChars });
  }

  /** The loading line, while an answer is on its way, then the answer's shape if it takes more than a moment, and
      after a few seconds why a fresh answer can take longer. The button stays usable (12 Oct 2026: Noemi typed a new
      request while a slow answer loaded, couldn't send it, and got the old answer under it): a new search cancels the
      old one. */
  function startLoading() {
    clearTimeout(skeletonTimer);
    clearTimeout(slowTimer);
    status.textContent = LABELS.loading;
    status.className = "status loading";
    results.setAttribute("aria-busy", "true");
    skeletonTimer = setTimeout(() => showOnly(skeleton()), SKELETON_AFTER_MS);
    slowTimer = setTimeout(() => { status.textContent = LABELS.loading + " " + LABELS.loadingSlow; }, SLOW_AFTER_MS);
  }

  /** Back to rest. `announce` is read out by screen readers only. */
  function stopLoading(announce) {
    clearTimeout(skeletonTimer);
    clearTimeout(slowTimer);
    status.textContent = announce || "";
    status.className = "status visually-hidden";
    results.setAttribute("aria-busy", "false");
  }

  /** How long drawing the newest answer took, in the browser's own performance timeline (User Timing): the pieces
      built and put on the page ("credible-recs:draw"), and until the next frame after that ("credible-recs:shown").
      For checking the page stays fast; never sent anywhere. */
  function measureDraw() {
    const start = drawStarted;
    try { performance.measure("credible-recs:draw", { start, end: performance.now() }); } catch (error) { return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      try { performance.measure("credible-recs:shown", { start, end: performance.now() }); } catch (error) { /* not measured */ }
    }));
  }

  /** What to show for one request: the answer drawn, or an error in the page's own words; null when a newer search
      cancelled it (`signal`). */
  async function fetchAnswer(request, signal) {
    let response;
    try {
      response = await fetch("/api/answer?q=" + encodeURIComponent(request), { headers: { Accept: "application/json" }, signal });
    } catch (error) {
      if (signal.aborted) return null;  // a newer search cancelled this one: nothing to show
      return [errorNotice("offline", request)];  // no reply at all: the server isn't running
    }
    const data = await response.json().catch(() => ({}));
    drawStarted = performance.now();
    if (!response.ok || !data.query) return [errorNotice(data.code, request)];
    track(STATUS_EVENTS[data.query.status]);
    return drawAnswer(data, request);
  }

  /** The hero steps aside once there's a request (its box stays on top), and comes back without one. */
  function compact(on) {
    hero.classList.toggle("compact", on);
    examples.open = !on;
    if (on && hero.getBoundingClientRect().top < 0) hero.scrollIntoView({ block: "start" });
  }

  async function search(text, addToHistory) {
    const request = text.trim();
    const mine = ++latest;
    if (pending) pending.abort();  // an older search still loading is cancelled: only the newest is ever drawn
    const controller = new AbortController();
    pending = controller;
    if (addToHistory) history.pushState(null, "", request ? "#q=" + encodeURIComponent(request) : location.pathname + location.search);
    if (!request) {
      stopLoading();
      showOnly(errorNotice("empty_request"));
      return;
    }
    if (addToHistory) rememberSearch(request);
    compact(true);
    startLoading();
    track("search");
    const shown = await fetchAnswer(request, controller.signal);
    if (mine !== latest || shown === null) return;  // a newer search has started: its answer is the one to show
    pending = null;
    showOnly(...shown);
    measureDraw();
    stopLoading(LABELS.done);
  }

  /** The request in the address bar (#q=...), so a reload or the back button shows the same search. Since 11 Oct 2026
      it sits after the "#", which browsers never send anywhere: not to this server, and not with the visit counts. */
  function fromAddress() {
    const request = requestInAddress();
    input.value = request;
    if (request.trim()) search(request, false);
    else {
      latest++;
      if (pending) pending.abort();
      showOnly();
      stopLoading();
      compact(false);
    }
  }

  /** The request after "#q=" in the address. An older link with "?q=..." is first moved there, so the request leaves
      the part of the address that is sent with every request. */
  function requestInAddress() {
    const query = new URLSearchParams(location.search);
    if (query.has("q")) {
      const old = query.get("q");
      query.delete("q");
      const rest = query.toString();
      history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + (old.trim() ? "#q=" + encodeURIComponent(old) : ""));
    }
    return new URLSearchParams(location.hash.slice(1)).get("q") || "";
  }

  /** Whether a key press belongs to a box someone is typing in. */
  function isTyping(target) {
    return Boolean(target && (target.isContentEditable || /^(input|textarea|select)$/i.test(target.tagName)));
  }

  /** "/" goes to the search box (13 Oct 2026), as on many search sites; never while someone is typing in a box. */
  function onKey(event) {
    if (event.key === "/" && !event.ctrlKey && !event.metaKey && !event.altKey && !isTyping(event.target)) {
      event.preventDefault();
      input.focus();
      input.select();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    search(input.value, true);
  });
  window.addEventListener("popstate", fromAddress);
  document.addEventListener("keydown", onKey);
  // Printing an answer prints all of it: every card's details open first.
  window.addEventListener("beforeprint", () => { for (const details of results.querySelectorAll("details")) details.open = true; });
  drawRecent();
  drawExamples();
  firstTimeQuestion();
  fromAddress();
})();
</script>
<!-- Filled in by the server: GoatCounter's script when visits are counted (engine/web.py), else nothing. It comes after
     the page's own script, so an old link's request has left the address before anything is counted. -->
{{COUNTER}}
</body>

[project]
name = "credible-recs"
version = "0.1.0"
description = "Credibility-ranked product picks for skincare, haircare and kitchen gear."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Module 1's free open model (Noemi, 11 Oct 2026); without it, the rules work alone. The Space installs 0.3.18, the
# version with prebuilt CPU wheels (deploy/huggingface/Dockerfile); this machine runs 0.3.16.
model = [
    "llama-cpp-python>=0.3.16",
]
# Going live (11 Oct 2026): the Hugging Face Space's downloads and feedback uploads, and the library upload
# (deploy/huggingface/DEPLOY.md). The local demo doesn't need it.
deploy = [
    "huggingface_hub>=0.30",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
